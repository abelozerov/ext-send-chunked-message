name: Publish npm package

on:
    release:
        types: [created]
    workflow_dispatch:

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    publish:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm install
            - run: npm run build
            - run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
